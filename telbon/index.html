<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Telbon — Business Club</title>

<!-- Eén letter in plaats van twee. Dat is het eerste wat "simpeler" betekent:
     Archivo doet de koppen, de tekst en de cijfers, en voor de cijfers staat
     font-variant-numeric op tabular zodat kolommen uitlijnen zonder dat er een
     tweede letter aan te pas komt. Valt het net weg, dan staat er system-ui en
     blijft alles leesbaar. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">

<style>
/* ===========================================================================
   Ziggo Business Club — Telbon, strakke versie

   Zelfde app, andere huid. Twee dingen zijn anders en ze hangen samen:

   1. De kleuren zijn die van de Ziggo Dome: zwart, oranje, wit. Het oranje is
      een vlak en een balk, nooit een letter op wit — #F60 op wit haalt de 3:1
      niet. Op zwart mag het wel, en als vulling met zwarte tekst erop is het
      juist het sterkste wat deze app heeft. Daarom is de hoofdknop oranje met
      zwarte letters.
   2. Rood en groen staan los van het oranje. Een verschil mag nooit dezelfde
      kleur hebben als een knop, anders leest elke knop als alarm.

   En wat eruit is: het papier. Geen perforatie, geen dubbele kaderlijnen, geen
   scheve stempel, geen tweede lettertype. Wat overblijft is een zwarte band
   bovenaan, witte vlakken, hairlines, en grote cijfers. Alles wat informatie
   draagt is gebleven; alles wat alleen sfeer droeg is weg.
   =========================================================================== */

:root{
  --zwart:#111110;
  --oranje:#ff6600;        /* Ziggo-oranje: vlak en balk, geen letter op wit */
  --oranje-diep:#c74e00;   /* dezelfde kleur, wel leesbaar als tekst op wit */
  --vlak:#ffffff;
  --grond:#f1f0ed;
  --inkt:#141413;
  --inkt-2:#5d5c58;
  --inkt-3:#97958f;
  --lijn:#e2e0db;
  --lijn-hard:#111110;
  --accent:var(--oranje);
  --opaccent:#111110;      /* wat er op het oranje staat */
  --stempel:#c4240f;
  --stempel-vlak:#fdeeeb;
  --goed:#13693f;
  --goed-vlak:#e8f2eb;
  --toets:#ffffff;
  --toetsrand:#d8d5cf;
  --toetsdruk:#eceae5;
  --raak:50px;
  --kop:'Archivo',system-ui,-apple-system,'Helvetica Neue',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-thema="licht"]){
    /* De gang achter de Business Club. Zwart is hier geen stijlkeuze maar de
       stand waarin de telefoon het vaakst opengaat. Het oranje blijft staan —
       dat is de enige kleur die in allebei de standen hetzelfde mag zijn. */
    --zwart:#000000;
    --vlak:#191917;
    --grond:#0b0b0a;
    --inkt:#f3f1ec;
    --inkt-2:#a5a29a;
    --inkt-3:#6d6a63;
    --lijn:#312f2b;
    --lijn-hard:#4e4b45;
    --oranje-diep:#ff8534;
    --opaccent:#111110;
    --stempel:#ff8a74;
    --stempel-vlak:#2b1512;
    --goed:#5fcf93;
    --goed-vlak:#122019;
    --toets:#232220;
    --toetsrand:#35332e;
    --toetsdruk:#3a3833;
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--grond); color:var(--inkt);
  font-family:var(--kop); font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%; font-synthesis-weight:none;
}
button,input,textarea{font-family:inherit; -webkit-tap-highlight-color:transparent}
/* Zelfde als bij Stand Count: op een iPhone zoomt het scherm bij twee snelle
   tikken, en tijdens het tellen tik je de hele tijd snel achter elkaar. Dit
   zet alleen die dubbeltik-zoom uit; knijpen blijft werken. Het tekenveld
   houdt zijn eigen touch-action:none, anders scrollt de pagina onder je
   handtekening weg. */
html{ touch-action:manipulation; }
button,.regel,.trap,.ctrl,.ctrlnr,.alles,.klavier button{ touch-action:manipulation; }
::selection{ background:var(--oranje); color:#111110; }
input,textarea{ caret-color:var(--oranje-diep); }
:focus-visible{ outline:2px solid var(--oranje-diep); outline-offset:2px; border-radius:3px; }
*{ scrollbar-width:thin; scrollbar-color:var(--lijn) transparent; }
::-webkit-scrollbar{ width:5px; height:5px; }
::-webkit-scrollbar-thumb{ background:var(--lijn); border-radius:3px; }
::-webkit-scrollbar-track{ background:transparent; }

/* alle cijfers in deze app lijnen uit, zonder tweede lettertype */
.mtab, .waarde, .somrij b, .geldrij b, .hoeveel, .bonnr, .vorder, .teller,
.klavier button, .geldrij input, .trapnaam small, .aanvulregel,
.artprijs{ font-variant-numeric:tabular-nums; }

/* ---- het blad ----------------------------------------------------------- */
.scherm{ max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; }
.scherm.vast{ height:100vh; height:100dvh; overflow:hidden; }
.vel{ flex:1 1 auto; background:var(--vlak); display:flex; flex-direction:column;
  min-height:0; position:relative; }
.blad{ flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  padding:0 18px 28px; }
.scherm:not(.vast) .blad{ overflow:visible; }
.scherm:not(.vast) .voet{ position:sticky; bottom:0; z-index:5; }

/* ---- de kop: zwarte band, oranje streep --------------------------------- */
.bonkop{ margin:0 -18px 0; padding:16px 18px 13px; background:var(--zwart);
  color:#ffffff; border-bottom:4px solid var(--oranje);
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.bontitel{ font-size:21px; font-weight:800; letter-spacing:-.015em; line-height:1.05;
  margin:0; }
.bonnr{ font-size:12px; color:rgba(255,255,255,.62); letter-spacing:.01em; margin-top:3px; }
.bonwie{ font-size:13.5px; color:var(--inkt-2); margin:12px 0 0; line-height:1.35; }
.bonwie b{ color:var(--inkt); font-weight:600; }

/* De stand van de bon. Geen stempel meer maar een label: rechtop, strak,
   één regel. Wat het zegt is belangrijker dan hoe het erbij hangt. */
.stempel{ flex:0 0 auto; border-radius:3px; padding:5px 9px 4px;
  font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  line-height:1.15; text-align:right; white-space:nowrap;
  background:rgba(255,255,255,.12); color:#ffffff; }
.stempel small{ display:block; font-size:10px; font-weight:500; letter-spacing:.02em;
  opacity:.72; margin-top:1px; text-transform:none; }
.stempel.rood{ background:var(--stempel); color:#ffffff; }
.stempel.groen{ background:var(--goed); color:#ffffff; }
.stempel.open{ background:transparent; color:rgba(255,255,255,.72);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3); }
.stempel.land{ animation:opkomen .3s ease-out both; }
@keyframes opkomen{ from{ opacity:0; transform:translateY(-3px); } }

/* ---- de ladder ---------------------------------------------------------- */
.ladder{ margin:16px 0 0; border:1px solid var(--lijn); border-radius:10px;
  overflow:hidden; }
.trap{ display:flex; align-items:center; gap:12px; width:100%; min-height:58px;
  padding:9px 13px; border:0; background:transparent; color:inherit;
  font:inherit; text-align:left; position:relative; }
.trap + .trap{ border-top:1px solid var(--lijn); }
.trap:active{ background:var(--toetsdruk); }
.trapnr{ flex:0 0 26px; height:26px; border-radius:50%; background:var(--grond);
  display:flex; align-items:center; justify-content:center; font-size:12px;
  font-weight:700; color:var(--inkt-3); }
.trap.af .trapnr{ background:var(--goed); color:#ffffff; }
.trap.af .trapnr svg{ width:14px; height:14px; }
.trap.nu .trapnr{ background:var(--oranje); color:#111110; }
.trap.let .trapnr{ background:var(--stempel); color:#ffffff; }
.trap.let .trapstand{ color:var(--stempel); }
.trapnaam{ flex:1 1 auto; min-width:0; font-size:15px; font-weight:600; }
.trapnaam small{ display:block; font-size:12px; font-weight:400; color:var(--inkt-2); }
.trapstand{ flex:0 0 auto; font-size:10.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--inkt-3); }
.trap.af .trapstand{ color:var(--goed); }
.trap.nu .trapstand{ color:var(--oranje-diep); }
.trap svg.pijl{ width:16px; height:16px; color:var(--inkt-3); flex:0 0 auto; }

/* ---- kleine koppen ------------------------------------------------------ */
.veldlabel{ font-size:11px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--inkt-2); }
.sectie{ margin:26px 0 0; }
.sectie > h2{ font-size:13px; font-weight:800; letter-spacing:.07em; margin:0 0 3px;
  text-transform:uppercase; color:var(--inkt); }
.sectie > h2::after{ content:""; display:block; width:26px; height:3px;
  background:var(--oranje); margin-top:6px; }
.sectie > p.toel{ font-size:13.5px; color:var(--inkt-2); margin:9px 0 13px; }

/* ---- de artikelen ------------------------------------------------------- */
.art{ margin:0 0 10px; padding:13px 14px; border:1px solid var(--lijn);
  border-radius:10px; }
.artkop{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.artnaam{ font-size:16px; font-weight:700; letter-spacing:-.01em; line-height:1.2; margin:0;
  overflow-wrap:anywhere; }
.artnaam i{ display:block; font-style:normal; font-size:12px; font-weight:400;
  color:var(--inkt-2); letter-spacing:0; }
.artprijs{ flex:0 0 auto; font-size:13px; font-weight:600; color:var(--inkt-2); }

.matrix{ margin-top:10px; overflow-x:auto; overscroll-behavior-x:contain; }
.mtab{ border-collapse:collapse; width:100%; min-width:max-content; }
.mtab th,.mtab td{ font-size:14px; font-weight:500; text-align:right;
  padding:3px 0 3px 12px; white-space:nowrap; }
.mtab th:first-child,.mtab td:first-child{ padding-left:0; text-align:left;
  font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--inkt-2); min-width:62px; position:sticky; left:0; background:var(--vlak); }
.mtab thead th{ vertical-align:bottom; font-size:11px; font-weight:700; letter-spacing:.05em;
  color:var(--inkt-2); border-bottom:1px solid var(--lijn); padding-bottom:5px;
  text-transform:uppercase; }
.mtab td.tot,.mtab thead th.tot{ padding-left:16px; font-weight:700; }
.mtab tr.rverkocht td{ border-top:1px solid var(--lijn); padding-top:6px;
  color:var(--inkt); font-weight:700; }
.mtab td.leeg{ color:var(--inkt-3); font-weight:400; }
.mtab td.fout{ color:var(--stempel); font-weight:700; }
.mtab tr.ruit td, .mtab tr.rterug td{ color:var(--inkt-2); }

.kassaregel{ display:flex; align-items:baseline; justify-content:space-between;
  gap:10px; margin-top:11px; padding-top:10px; border-top:1px solid var(--lijn);
  font-size:13px; }
.kassaregel .veldlabel{ flex:0 0 auto; }
.kassaregel b{ font-size:17px; font-weight:700; }
.kassaregel.open b{ color:var(--inkt-3); }

/* ---- meldingen, groen en rood ------------------------------------------- */
.verschil{ display:flex; align-items:flex-start; gap:10px; margin-top:10px;
  padding:11px 12px; border-radius:8px; border-left:4px solid var(--stempel);
  background:var(--stempel-vlak); color:var(--stempel); }
.verschil svg{ flex:0 0 auto; width:18px; height:18px; margin-top:1px; }
.verschil b{ display:block; font-size:15px; font-weight:700; }
.verschil p{ margin:3px 0 0; font-size:13px; line-height:1.4; color:var(--inkt-2); }
.verschil.goed{ border-left-color:var(--goed); background:var(--goed-vlak); color:var(--goed); }
.melding{ display:flex; gap:10px; align-items:flex-start; margin:0 0 16px;
  padding:12px 13px; border-radius:8px; border-left:4px solid var(--stempel);
  background:var(--stempel-vlak); }
.melding svg{ flex:0 0 auto; width:18px; height:18px; color:var(--stempel); margin-top:1px; }
.melding > div > b{ display:block; font-size:15px; color:var(--stempel); margin-bottom:3px; }
.melding p{ margin:0; font-size:13.5px; color:var(--inkt-2); line-height:1.4; }
.melding p b{ color:var(--inkt); font-weight:700; }
.melding .acties{ display:flex; flex-wrap:wrap; gap:16px; margin-top:9px; }
.melding.stil{ border-left-color:var(--inkt-3); background:var(--grond); }
.melding.stil svg,.melding.stil b{ color:var(--inkt); }
.bewaardbalk{ font-size:12.5px; font-weight:600; color:var(--goed); padding:8px 18px 0; }

/* ---- de slotsom --------------------------------------------------------- */
.som{ margin-top:20px; border-top:3px solid var(--zwart); }
.somrij{ display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  padding:9px 0; font-size:14.5px; }
.somrij + .somrij{ border-top:1px solid var(--lijn); }
.somrij span{ flex:1 1 auto; }
.somrij b{ flex:0 0 auto; font-size:17px; font-weight:700; }
.somrij.groot{ font-size:16px; font-weight:700; }
.somrij.groot b{ font-size:26px; letter-spacing:-.02em; }
.somrij.afwijk b{ color:var(--stempel); }
.somrij.akkoord b{ color:var(--goed); }
.somrij small{ display:block; font-size:12.5px; font-weight:400; color:var(--inkt-2); }

/* ---- het geld: het grootste blok van de app ----------------------------- */
.geld{ margin-top:14px; border:1px solid var(--lijn); border-radius:10px; overflow:hidden; }
.geldrij{ display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:13px 14px; }
.geldrij + .geldrij{ border-top:1px solid var(--lijn); }
.geldrij span{ flex:1 1 auto; font-size:14.5px; }
.geldrij span small{ display:block; font-size:12.5px; font-weight:400; color:var(--inkt-2); }
.geldrij b{ flex:0 0 auto; font-size:23px; font-weight:700; letter-spacing:-.015em; }
.geldrij.slot{ background:var(--zwart); color:#ffffff; }
.geldrij.slot span{ font-weight:700; font-size:15.5px; }
.geldrij.slot span small{ font-weight:400; color:rgba(255,255,255,.66); }
.geldrij.slot b{ font-size:28px; }
.geldrij.slot.afwijk b{ color:#ff8a74; }
.geldrij.slot.akkoord b{ color:#5fcf93; }
.geldrij.slot.open b{ color:rgba(255,255,255,.4); }
.geldrij input{ flex:0 0 122px; min-width:0; height:46px; text-align:right; padding:0 12px;
  font-size:20px; font-weight:700; border:1px solid var(--toetsrand); border-radius:8px;
  background:var(--toets); color:var(--inkt); }
.geldrij input:focus{ outline:none; border-color:var(--oranje);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--oranje) 30%, transparent); }

/* ---- handtekeningen ----------------------------------------------------- */
.tekenpaar{ display:flex; flex-direction:column; gap:12px; margin-top:12px; }
.tekenvak{ border:1px solid var(--lijn); border-radius:10px; padding:11px 13px 12px; }
.tekenvak .veldlabel{ display:block; margin-bottom:3px; }
.tekenvak .wie{ font-size:15px; font-weight:700; }
.tekenvak .wanneer{ font-size:12.5px; color:var(--inkt-2); }
.krabbel{ display:block; width:100%; height:62px; margin:6px 0 0;
  border-bottom:2px solid var(--lijn-hard); }
.krabbel img{ display:block; height:56px; max-width:100%; object-fit:contain; object-position:left bottom; }
.krabbel.leeg{ display:flex; align-items:flex-end; padding-bottom:5px;
  font-size:12.5px; color:var(--inkt-3); }
@media (prefers-color-scheme: dark){
  :root:not([data-thema="licht"]) .krabbel img{ filter:invert(1) brightness(1.5); }
}
.tekenveld{ width:100%; height:180px; border:2px dashed var(--lijn);
  border-radius:10px; background:var(--grond); touch-action:none; display:block; }
.tekenveld.vol{ border-style:solid; border-color:var(--oranje); }
.tekenlijn{ margin:-28px 16px 0; border-bottom:2px solid var(--lijn-hard);
  position:relative; pointer-events:none; }
.tekenhint{ font-size:12.5px; color:var(--inkt-3); margin:10px 0 0; text-align:center; }
.verklaring{ font-size:15px; line-height:1.5; margin:16px 0; }
.verklaring b{ font-weight:700; }

/* ---- aanvullingen en correcties ----------------------------------------- */
.aanvul{ display:flex; gap:10px; align-items:flex-start; margin:14px 0 0;
  padding:12px 13px; border-radius:8px; border-left:4px solid var(--oranje);
  background:color-mix(in srgb, var(--oranje) 9%, transparent); }
.aanvul svg{ flex:0 0 auto; width:18px; height:18px; color:var(--oranje-diep); margin-top:2px; }
.aanvul b{ display:block; font-size:15px; font-weight:700; margin-bottom:2px; }
.aanvul p{ margin:0; font-size:13px; color:var(--inkt-2); line-height:1.4; }
.aanvul .acties{ display:flex; flex-wrap:wrap; gap:16px; margin-top:8px; }
.aanvul.weg{ background:var(--grond); border-left-color:var(--inkt-3); }
.aanvul.weg svg{ color:var(--inkt-3); }
.aanvullijst{ margin:10px 0 0; }
.aanvulregel{ display:flex; gap:10px; align-items:baseline; padding:7px 0;
  border-top:1px solid var(--lijn); font-size:13px; }
.aanvulregel i{ flex:0 0 46px; font-style:normal; font-size:12.5px; font-weight:600;
  color:var(--inkt-2); }
.aanvulregel span{ flex:1 1 auto; min-width:0; }
.aanvulregel b{ flex:0 0 auto; font-size:14px; font-weight:700; }

/* ---- velden ------------------------------------------------------------- */
.vraag{ font-size:16px; font-weight:700; margin:20px 0 3px; }
.vraagbij{ font-size:13.5px; color:var(--inkt-2); margin:0 0 10px; }
.veld{ width:100%; height:var(--raak); padding:0 14px; font-size:16px;
  border:1px solid var(--toetsrand); border-radius:9px; background:var(--toets);
  color:var(--inkt); }
.veld::placeholder{ color:var(--inkt-3); }
.veld:focus{ outline:none; border-color:var(--oranje);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--oranje) 30%, transparent); }
.keus{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.keus button{ min-height:70px; border:1px solid var(--toetsrand); border-radius:10px;
  background:var(--toets); color:inherit; font:inherit; display:flex;
  flex-direction:column; align-items:flex-start; justify-content:center; gap:3px;
  padding:10px 12px; text-align:left; }
.keus button b{ font-size:15px; font-weight:700; }
.keus button i{ font-style:normal; font-size:12px; color:var(--inkt-2); }
.keus button:active{ background:var(--toetsdruk); }
.keus button.aan{ border-color:var(--oranje); background:var(--oranje); color:#111110; }
.keus button.aan i{ color:#111110; opacity:.75; }

/* ---- knoppen ------------------------------------------------------------
   Drie trappen. De oranje is de inkt van deze app en er is er één per scherm;
   zwarte letters erop, want oranje met wit haalt het contrast niet. */
.voet{ flex:0 0 auto; padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--lijn); background:var(--vlak);
  display:flex; gap:10px; align-items:stretch; }
.knop{ flex:1 1 auto; min-height:var(--raak); border:0; border-radius:9px;
  font:inherit; font-size:16px; font-weight:700; background:var(--oranje);
  color:#111110; display:flex; align-items:center; justify-content:center;
  gap:9px; padding:0 16px; transition:filter .1s ease-out, transform .1s ease-out; }
.knop svg{ width:18px; height:18px; flex:0 0 auto; }
.knop:active{ transform:scale(.985); filter:brightness(1.06); }
.knop.stil{ background:transparent; color:var(--inkt); border:1px solid var(--toetsrand); }
.knop.stil:active{ background:var(--toetsdruk); filter:none; }
.knop.krimp{ flex:0 0 auto; }
.knop.let{ background:transparent; color:var(--stempel); border:1px solid var(--stempel); }
.knop:disabled{ opacity:.38; }
.tekstknop{ display:inline-flex; align-items:center; gap:7px; min-height:var(--raak);
  border:0; background:transparent; color:var(--oranje-diep); font:inherit; font-size:14.5px;
  font-weight:700; padding:0; text-decoration:underline; text-underline-offset:3px;
  text-decoration-thickness:2px; }
.tekstknop svg{ width:16px; height:16px; }
.tekstknop:active{ opacity:.6; }
.laadknop{ pointer-events:none; opacity:.75; }
.laadknop svg.spin{ animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---- telscherm ---------------------------------------------------------- */
.telkop{ flex:0 0 auto; padding:13px 18px 10px; background:var(--zwart);
  color:#ffffff; border-bottom:4px solid var(--oranje); }
.telkop .bontitel{ font-size:17px; }
.telkop .rij{ display:flex; align-items:flex-start; justify-content:space-between;
  gap:10px; margin:0; }
.telkop .knop.stil{ color:#ffffff; border-color:rgba(255,255,255,.35); }
.balk{ display:block; height:4px; background:rgba(255,255,255,.18); border-radius:2px;
  margin-top:10px; }
.balk i{ display:block; height:4px; width:0; background:var(--oranje); border-radius:2px;
  transition:width .22s cubic-bezier(.16,1,.3,1); }
.vorder{ display:block; font-size:12px; color:rgba(255,255,255,.66); margin-top:5px; }

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

}
