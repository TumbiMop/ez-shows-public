<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Stand Count</title>
<style>
  /* Deze pagina staat leeg op het web. Alles wat over een show gaat — artiest,
     zaal, artikelen, aantallen — komt uit het stuk achter de # in de link, en
     dat stuk stuurt een browser nooit naar de server. Er staat hier dus nooit
     iets van een klant op een vreemde schijf. */
  :root{
    --inkt:#14140f; --zacht:#5d5b53; --flauw:#8d8a80;
    --lijn:#dcd9cf; --grond:#faf9f5; --vlak:#ffffff;
    --accent:#0b57d0; --opaccent:#ffffff; --goed:#166b40; --let:#b3261e;
    --toets:#ffffff; --toetsrand:#d2cec2; --toetsdruk:#e8e4d8;
    --raak:48px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-thema="licht"]){
      --inkt:#f2f1ec; --zacht:#b9b6ab; --flauw:#7d7a71;
      --lijn:#2f2f33; --grond:#121214; --vlak:#1a1a1e;
      --accent:#8fb0ff; --opaccent:#101320; --goed:#5fd196; --let:#ff8a80;
      --toets:#26262c; --toetsrand:#35353d; --toetsdruk:#3a3a44;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  form{margin:0}
  body{
    background:var(--grond); color:var(--inkt);
    font-family:-apple-system,"Helvetica Neue",Helvetica,sans-serif;
    font-size:17px; line-height:1.4; -webkit-text-size-adjust:100%;
  }
  button,input{font-family:inherit; -webkit-tap-highlight-color:transparent}

  /* Een vaste hoogte, geen minimum. Met min-height groeit de lijst door de
     onderkant heen en staat de voet met Versturen onder de vouw — dat was op
     het nakijkscherm precies wat er gebeurde. Nu scrolt de lijst zelf en
     blijven de kop, het klavier en de voet staan waar ze staan. */
  .scherm{ max-width:520px; margin:0 auto; height:100vh; height:100dvh;
    display:flex; flex-direction:column; overflow:hidden; }

  /* ---- kop ---- */
  /* Compacter dan eerst. Op een iPhone stond het toetsenbord over de vierde
     maat heen; nu passen er vijf onder elkaar, zodat een shirt in één beeld
     staat en je niet hoeft te scrollen terwijl je telt. */
  /* Dezelfde kop als op het papieren telvel: het gekleurde blokje van de zaal,
     de artiest in kapitalen, en rechts de stand met eronder wat voor telling het
     is. Daar stond hij goed, dus hier hoort hij ook zo te staan. */
  .kop{ padding:10px 16px 7px; border-bottom:1px solid var(--lijn); background:var(--vlak); }
  .hd{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    border-bottom:3px solid var(--inkt); padding-bottom:8px; }
  .hl{ display:flex; align-items:flex-start; gap:10px; min-width:0; }
  .sq{ flex:0 0 auto; width:34px; height:34px; border-radius:2px; background:var(--inkt); }
  .band{ font-size:18px; font-weight:800; text-transform:uppercase; letter-spacing:-.01em;
    line-height:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub{ font-size:11.5px; margin-top:4px; color:var(--zacht);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hr2{ flex:0 0 auto; text-align:right; border:0; background:transparent;
    font-family:inherit; color:inherit; padding:0 0 0 6px; margin:0; }
  .hr2:active .stand{ color:var(--accent); }
  /* De stand is aantikbaar: één link gaat naar alle stands, dus wie zich
     vergist moet terug kunnen zonder de link opnieuw te vragen. */
  .stand{ display:block; font-size:14px; font-weight:800; line-height:1.15; white-space:nowrap; }
  .kind{ display:block; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    margin-top:3px; color:var(--zacht); white-space:nowrap; }
  /* Allebei expliciet blok: ze stonden al onder elkaar, maar alleen doordat het
     blokje erin display:block had. Dat is geen afspraak om op te bouwen. */
  .balk{ display:block; height:4px; background:var(--lijn); border-radius:2px;
    margin-top:8px; overflow:hidden; }
  .balk i{ display:block; height:4px; width:0; background:var(--accent); transition:width .2s; }
  .vorder{ display:block; font-size:11px; color:var(--zacht); margin-top:4px; }

  /* ---- het artikel en zijn maten ----------------------------------------
     De lijst is een kolom met het klavier eronder. "Alles uitverkocht" hangt
     met margin-top:auto onderaan, zodat die knop altijd op dezelfde plek staat
     — of een artikel nu één maat heeft of zes. Dat is wat een duim onthoudt. */
  .midden{ flex:1 1 auto; padding:11px 16px 0; overflow-y:auto;
    overscroll-behavior:contain; display:flex; flex-direction:column; }
  .midden::-webkit-scrollbar{ width:4px; }
  .midden::-webkit-scrollbar-thumb{ background:var(--lijn); border-radius:2px; }

  .artikel{ display:flex; align-items:center; justify-content:space-between;
    gap:8px; margin:0 0 6px; }
  .artikel .verder{ margin-left:0; margin-right:-7px; }
  .artikel .terug{ flex:0 0 auto; width:38px; height:38px; margin-left:-7px;
    display:flex; align-items:center; justify-content:center;
    border:0; border-radius:50%; background:transparent; color:var(--accent); }
  .artikel .terug svg{ width:21px; height:21px; display:block; }
  .artikel .terug:active{ background:var(--toetsdruk); }
  .artikel .terug:disabled{ opacity:.25; }
  /* De naam is een knop naar het overzicht: bij vijftien artikelen wil je niet
     vijftien keer op volgende tikken om bij de posters te komen. */
  .artnaam{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:6px;
    border:0; background:transparent; color:inherit; font:inherit; text-align:left;
    padding:4px 7px; margin:0 -7px; border-radius:10px; }
  .artnaam:active{ background:var(--toetsdruk); }
  .artnaam svg{ flex:0 0 auto; width:15px; height:15px; color:var(--flauw); display:block; }
  /* Liever twee regels dan "LONGSLEEVE MAR...": de naam van het artikel is waar
     je op af gaat, en bij J. Cole zijn ze lang. */
  .artikel h1{ flex:0 1 auto; min-width:0; font-size:21px; font-weight:800; letter-spacing:-.02em;
    line-height:1.12; margin:0; overflow-wrap:anywhere; }
  .artikel .teller{ flex:0 0 auto; font-size:11.5px; font-weight:600; color:var(--zacht); }
  .onder{ font-size:12px; color:var(--zacht); margin:0 0 9px; }

  .regel{ display:flex; align-items:center; gap:12px; width:100%;
    padding:0 10px; margin:0 -10px; min-height:var(--raak); border:0;
    background:transparent; color:inherit; font:inherit; text-align:left;
    border-radius:10px; position:relative; }
  .regel + .regel::before{ content:""; position:absolute; left:10px; right:10px;
    top:0; height:1px; background:var(--lijn); }
  .regel.hier{ background:color-mix(in srgb, var(--accent) 13%, transparent); }
  .regel.hier::before, .regel.hier + .regel::before{ background:transparent; }
  .maat{ flex:1 1 auto; min-width:0; font-size:17px; font-weight:700; }
  .maat small{ display:block; font-size:11px; font-weight:400; color:var(--zacht); }
  .regel.hier .maat{ color:var(--accent); }
  .waarde{ flex:0 0 auto; min-width:76px; text-align:right; font-size:23px;
    font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  /* Een 0 is een waarde, een streepje is "nog niet geteld". Dat onderscheid is
     het hele punt van dit scherm: een leeg vakje is dubbelzinnig. */
  .waarde.leeg{ color:var(--flauw); font-weight:500; }
  .waarde.af{ color:var(--goed); }
  .regel.hier .waarde{ color:var(--inkt); }
  .vink{ flex:0 0 auto; width:18px; height:18px; color:var(--goed); opacity:0; }
  .vink.aan{ opacity:1; }
  .regel.landt .waarde{ animation:landt .32s cubic-bezier(.16,1,.3,1); }
  @keyframes landt{ from{ transform:translateY(-3px) scale(1.09); } to{ transform:none; } }
  @media (prefers-reduced-motion:reduce){
    .regel.landt .waarde{ animation:none; }
    .balk i{ transition:none; }
  }

  .uitverkocht{ display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; min-height:46px; margin:14px 0 12px; margin-top:auto; flex:0 0 auto;
    border-radius:11px; border:1px solid var(--lijn); background:transparent;
    color:var(--zacht); font:inherit; font-size:14.5px; font-weight:600; }
  .uitverkocht svg{ width:17px; height:17px; display:block; }
  .vink svg{ width:18px; height:18px; display:block; }
  .mist button svg{ width:16px; height:16px; display:inline-block; vertical-align:-2px; }
  .uitverkocht:active{ background:var(--toetsdruk); }
  .uitverkocht.zeker{ border-color:var(--let); color:var(--let); }

  /* ---- het klavier -------------------------------------------------------
     Vier kolommen: de hulptoetsen staan rechts in een eigen kolom, zodat er een
     hele rij af kan. Dat scheelt ruim zeventig pixels en die gaan naar de lijst.

     Dit klavier hoort bij de pagina, niet bij de telefoon. Daarom schuift er
     niets meer: er is geen toetsenbord dat opkomt, geen balk die moet raden hoe
     hoog dat ding staat, en geen invoerveld waar een getal uit kan verdwijnen. */
  .klavier{ flex:0 0 auto; display:grid; gap:6px;
    grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr);
    padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    background:var(--vlak); border-top:1px solid var(--lijn); }
  .klavier button{ display:flex; align-items:center; justify-content:center; gap:7px;
    height:50px; border-radius:11px; border:1px solid var(--toetsrand);
    background:var(--toets); color:var(--inkt); font:inherit; font-size:25px;
    font-weight:600; font-variant-numeric:tabular-nums;
    transition:background .09s ease-out, transform .09s ease-out; }
  .klavier button:active{ background:var(--toetsdruk); transform:scale(.97); }
  .klavier button svg{ width:22px; height:22px; display:block; }
  .klavier .hulp{ font-size:15px; font-weight:700; color:var(--zacht); }
  /* De nul staat over twee vakjes in plaats van drie; het vakje dat vrijkomt
     wordt "vorige". Die staat daarmee direct links van de blauwe toets, zodat
     heen en terug naast elkaar onder dezelfde duim liggen. */
  .klavier .nul{ grid-column:span 2; }
  .klavier .vorige{ font-size:13px; font-weight:700; color:var(--accent); gap:5px; }
  .klavier .vorige svg{ width:16px; height:16px; }
  .klavier .vorige:disabled{ opacity:.3; color:var(--zacht); }
  /* height:auto is hier het hele punt: de toets staat over twee vakjes, maar met
     de vaste 50px van .klavier button bleef hij er één vullen. Dit is de toets
     die de hele avond ingedrukt wordt, dus die hoort de grootste te zijn. */
  .klavier .door{ grid-row:span 2; height:auto; flex-direction:column; gap:5px;
    background:var(--accent); border-color:transparent; color:var(--opaccent);
    font-size:13.5px; font-weight:700; line-height:1.15; text-align:center; padding:0 4px; }
  .klavier .door:active{ background:var(--accent); transform:scale(.97); filter:brightness(1.08); }
  .klavier .door svg{ width:23px; height:23px; }

  /* ---- aanmelden ---------------------------------------------------------
     Eén link voor alle stands betekent dat de pagina niet weet wie hem opent.
     Daarom begint hij met twee vragen die niet overgeslagen kunnen worden. Een
     telling zonder afzender is in de zaal onbruikbaar: dan weet je wel dat er
     zeven hoodies liggen, maar niet waar. */
  .poort{ flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain;
    padding:20px 16px 16px; display:flex; flex-direction:column; }
  .shw{ font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    color:var(--zacht); }
  .shwb{ font-size:23px; font-weight:800; letter-spacing:-.02em; line-height:1.1; margin:2px 0 1px; }
  .shwz{ font-size:13px; color:var(--zacht); margin-bottom:18px; }
  .vraag{ font-size:17px; font-weight:700; margin:0 0 3px; }
  .vraagbij{ font-size:13px; color:var(--zacht); margin:0 0 11px; }
  .veld{ width:100%; height:var(--raak); padding:0 14px; font-size:17px;
    border:1px solid var(--lijn); border-radius:12px; background:var(--vlak); color:var(--inkt); }
  .veld:focus{ outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }

  /* Een raster, zoals de knoppen op de kassa. Bij dertien stands scrolt het
     mee; de knop onderaan blijft staan. */
  .chips{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .chip{ min-height:60px; border:1px solid var(--lijn); border-radius:12px;
    background:var(--vlak); color:inherit; font:inherit; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px; padding:5px 4px; }
  .chip b{ font-size:19px; font-weight:800; }
  .chip i{ font-style:normal; font-size:10.5px; font-weight:600; color:var(--zacht);
    text-align:center; line-height:1.15; max-width:100%; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .chip:active{ background:var(--toetsdruk); }
  .chip.aan{ border-color:transparent; background:var(--accent); color:var(--opaccent); }
  .chip.aan i{ color:var(--opaccent); opacity:.85; }
  .rek{ flex:1 1 auto; min-height:14px; }

  /* ---- het overzicht ---- */
  .menubij{ font-size:13px; color:var(--zacht); margin:0 0 12px; }
  .menurij{ display:flex; align-items:center; gap:11px; width:100%; min-height:52px;
    padding:7px 9px; margin:0 -9px; border:0; background:transparent; color:inherit;
    font:inherit; text-align:left; border-radius:10px; position:relative; }
  .menurij + .menurij::before{ content:""; position:absolute; left:9px; right:9px; top:0;
    height:1px; background:var(--lijn); }
  .menurij:active{ background:var(--toetsdruk); }
  .menurij.hier{ background:color-mix(in srgb, var(--accent) 13%, transparent); }
  .menurij.hier::before, .menurij.hier + .menurij::before{ background:transparent; }
  .mnr{ flex:0 0 24px; height:24px; border-radius:50%; background:var(--toetsdruk);
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:800; color:var(--zacht); }
  .menurij.hier .mnr{ background:var(--accent); color:var(--opaccent); }
  .mnm{ flex:1 1 auto; min-width:0; font-size:16px; font-weight:700;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mnm small{ display:block; font-size:11px; font-weight:400; color:var(--zacht); }
  .mvoort{ flex:0 0 auto; display:flex; align-items:center; gap:5px;
    font-size:13px; font-weight:600; color:var(--flauw); font-variant-numeric:tabular-nums; }
  .mvoort.af{ color:var(--goed); }
  .mvoort svg{ width:16px; height:16px; display:block; }

  /* ---- slot ---- */
  .slot{ padding-bottom:10px; }
  .slot h1{ font-size:23px; font-weight:800; letter-spacing:-.02em; margin:0 0 10px; }
  .mist{ border:1px solid var(--let); border-radius:12px; padding:11px 13px; margin:0 0 14px;
    background:color-mix(in srgb, var(--let) 7%, transparent); }
  .mist b{ display:block; font-size:15px; color:var(--let); margin-bottom:2px; }
  .mist p{ margin:0 0 6px; font-size:13px; color:var(--zacht); }
  .mist button{ display:block; width:100%; text-align:left; background:none; border:0;
    border-top:1px solid var(--lijn); padding:10px 0 9px; color:var(--accent);
    font:inherit; font-size:15px; font-weight:600; min-height:var(--raak); }
  /* Elke regel van de telling is aan te tikken, ook een die al ingevuld is.
     Je ziet aan het eind pas dat je bij de hoodies een maat door elkaar hebt
     gehaald, en dan wil je daarheen — niet alleen naar wat nog leeg is. */
  .somrij{ display:flex; justify-content:space-between; align-items:center; gap:12px;
    width:100%; padding:7px 8px; margin:0 -8px; min-height:var(--raak);
    border:0; background:transparent; color:inherit; font:inherit; text-align:left;
    border-radius:9px; position:relative; }
  .somrij + .somrij::before{ content:""; position:absolute; left:8px; right:8px; top:0;
    height:1px; background:var(--lijn); }
  .somrij:active{ background:var(--toetsdruk); }
  .somrij span{ flex:1 1 auto; min-width:0; font-size:15px; }
  .somrij b{ flex:0 0 auto; font-variant-numeric:tabular-nums; font-size:17px; }
  /* "lijst 12" in het rood las als een code. Wat er staat is het aantal dat
     volgens het Stands-blad bij je hoort te liggen, en dat hoort er in gewone
     woorden te staan — en alleen als het afwijkt. */
  .somrij small{ display:block; font-size:12px; font-weight:600; color:var(--let);
    line-height:1.3; margin-top:1px; }
  .somtotaal{ display:flex; justify-content:space-between; gap:12px;
    padding:12px 8px 4px; margin:4px -8px 0; border-top:2px solid var(--lijn);
    font-size:17px; font-weight:800; }
  .somtotaal b{ font-variant-numeric:tabular-nums; }
  /* De naam wordt niet meer onderaan gevraagd maar vooraan, en staat hier
     alleen nog als ondertekening. */
  .ondertekend{ font-size:13px; color:var(--zacht); margin:0 0 13px; }
  .ondertekend b{ color:var(--inkt); }

  /* ---- voet ---- */
  .voet{ flex:0 0 auto; padding:9px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--lijn); background:var(--vlak); display:flex; gap:10px; }
  .knop{ flex:1 1 auto; min-height:var(--raak); border:0; border-radius:13px;
    font:inherit; font-size:16.5px; font-weight:700; background:var(--accent);
    color:var(--opaccent); display:flex; align-items:center; justify-content:center; gap:8px; }
  .knop svg{ width:18px; height:18px; display:block; }
  .knop.stil{ flex:0 0 36%; background:transparent; color:var(--accent);
    border:1px solid var(--lijn); }
  .knop:disabled{ opacity:.4 }

  .bewaard{ font-size:12.5px; color:var(--goed); padding:0 16px 10px; }
  .stuk{ padding:40px 18px; text-align:center; color:var(--zacht); }
  .stuk h1{ font-size:22px; color:var(--inkt); margin:0 0 8px; }

</style>
</head>
<body>
<div class="scherm" id="app"><div class="stuk">Even laden…</div></div>



<script>
/* ===========================================================================
   Stand Count — de pagina die een standteller op zijn telefoon opent.

   Waarom dit bestand bestaat: een .html-bijlage opent op een iPhone niet als
   pagina. iOS geeft hem aan Quick Look en dat voert geen vreemde HTML uit, dus
   de teller moest eerst bewaren in Bestanden en dan openen in Safari. Een
   https-link gaat wel gewoon open, met één tik, in WhatsApp zelf.

   Deze pagina staat daarom leeg op het web en krijgt de show mee in de hash.
   Een browser stuurt alles achter de # nooit naar de server — de artiest, de
   zaal en de aantallen blijven dus tussen Eran en de teller.

   De terugweg is onveranderd: dezelfde SFM1-coderegel die Tumbi al leest.
   =========================================================================== */

var D = null, ITEMS = [], STAP = 0, WAARDEN = {}, TELLER = '';

/* Welke stand dit is, en of de poort nog open moet. Bij een link voor alle
   stands staat STAND op 0 tot iemand hem aantikt. */
var STAND = 0, POORT = true, MENU = false;

/* ---- de link uitpakken -------------------------------------------------- */
function uitHash(){
  var h = String(location.hash || '').replace(/^#/, '');
  if (!h) return 'leeg';
  var txt;
  try {
    var b64 = h.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    /* atob geeft bytes; via escape/decodeURIComponent komen accenten goed terug. */
    txt = decodeURIComponent(escape(atob(b64)));
  } catch (e){ return null; }

  /* Links van voor de verkorting zijn JSON. Die blijven werken: een link die al
     in iemands WhatsApp staat hoort niet stuk te gaan omdat ik de vorm veranderde. */
  if (txt.charAt(0) === '{'){
    try { return JSON.parse(txt); } catch (e){ return null; }
  }

  /* De korte vorm. Drie scheidingstekens die in geen artikelnaam voorkomen, dus
     er valt niets verkeerd te splitsen en hoeft er niets ontsnapt te worden. */
  try {
    var V = '\x01', R = '\x02', S = '\x03';
    var k = txt.split(V);
    /* 1 is de link per stand, 2 die voor alle stands samen. Allebei blijven
       werken: een link die al in iemands WhatsApp staat hoort niet stuk te gaan
       omdat de vorm veranderde. */
    if (k[0] !== '1' && k[0] !== '2') return null;
    var d = {
      b: k[1], v: k[2],
      d: (k[3] && k[3].length === 8)
           ? k[3].slice(0,4) + '-' + k[3].slice(4,6) + '-' + k[3].slice(6)
           : k[3],
      s: k[4], n: k[5], m: (k[6] === 'I' ? 'in' : 'final'),
      c: k[7], w: k[8], t: null, r: []
    };
    if (k[0] === '2'){
      /* Veld 5 draagt dan niet één standnaam maar de hele lijst. Het vierde
         scheidingsteken komt in geen enkele zaalnaam voor. */
      d.stands = String(k[5] || '').split('\x04');
      /* Veld 4 draagt bij deze vorm geen standnummer maar de kleur van de zaal:
         het blokje linksboven, zoals op het papieren telvel. */
      d.k = k[4] ? ('#' + String(k[4]).replace('#', '')) : '';
      d.s = null; d.n = null;
      if (!d.stands.length) return null;
    }
    if (k[9]){
      d.t = {};
      k[9].split(',').forEach(function(p){
        var m = /^(\d+):(-?\d+)$/.exec(p);
        if (m) d.t[m[1]] = m[2];
      });
    }
    var vorig = null;
    (k[10] || '').split(R).forEach(function(rij){
      if (!rij) return;
      var v = rij.split(S);
      var no = (v[0] === '') ? (vorig === null ? 0 : vorig + 1) : parseInt(v[0], 10);
      vorig = no;
      var kn = v[1] || '';
      /* Rauw houden: bij een link voor alle stands staat hier niet één
         lijstaantal maar dat van elke stand, met komma's ertussen. */
      d.r.push([no, kn.slice(1), kn.charAt(0), (v[2] === '' || v[2] == null) ? null : String(v[2])]);
    });
    return d.r.length ? d : null;
  } catch (e){ return null; }
}

/* ---- de regels groeperen tot artikelen ---------------------------------- */
/* Een artikel is een kopregel met zijn maten eronder, of een los artikel zonder
   maten. Dat is de eenheid waarin iemand telt: je pakt een stapel shirts en
   telt alle maten, niet één maat uit het midden van een lange lijst. */
function groepeer(rows){
  var uit = [], band = null, nu = null;
  rows.forEach(function(r){
    if (r.kind === 'band'){ band = r.name; nu = null; return; }
    if (r.kind === 'h'){ nu = { naam:r.name, band:band, regels:[] }; uit.push(nu); return; }
    if (r.kind === 's' && nu){ nu.regels.push(r); return; }
    uit.push({ naam:r.name, band:band, regels:[r] });
    nu = null;
  });
  return uit.filter(function(p){ return p.regels.length; });
}

/* ---- wie telt, en waar --------------------------------------------------
   Eén link gaat naar alle stands. De pagina weet dus niet wie hem opent, en
   vraagt dat voordat er geteld kan worden: je naam en je stand, allebei
   verplicht. Een telling zonder afzender is in de zaal onbruikbaar — dan weet
   je wel dat er zeven hoodies over zijn, maar niet waar ze liggen.

   Wat je kiest blijft op deze telefoon staan. Wie de pagina kwijtraakt en
   opnieuw opent, komt terug waar hij was en hoeft zich niet nog eens te
   melden. */
function standLijst(){
  return (D.stands && D.stands.length) ? D.stands : null;
}
function standNaam(nr){
  var l = standLijst();
  var n = String((l ? l[nr-1] : D.n) || '').trim();
  /* "Stand 3" als naam is geen naam: het nummer staat er al. */
  return /^stand\s*\d+$/i.test(n) ? '' : n;
}
function standLabel(nr){
  var n = standNaam(nr);
  return 'Stand ' + nr + (n ? ' \u00b7 ' + n : '');
}
function klaar(){ return !!(String(TELLER).trim() && STAND); }

function wieSleutel(){ return 'standcount.wie.' + D.c + '.' + D.d + '.' + D.m; }
function wieBewaar(){
  try { localStorage.setItem(wieSleutel(), JSON.stringify({ s:STAND, t:TELLER })); } catch (e){}
}
function wieTerug(){
  try {
    var x = JSON.parse(localStorage.getItem(wieSleutel()) || 'null');
    if (!x || !x.t) return false;
    var l = standLijst();
    /* Alleen een link voor alle stands haalt de stand uit wat bewaard is. Een
       link die zijn eigen stand meedraagt houdt die; anders stuurt een eerdere
       keuze op deze telefoon de telling naar de verkeerde stand. */
    if (l){
      if (!(x.s >= 1 && x.s <= l.length)) return false;
      STAND = +x.s;
    }
    TELLER = String(x.t);
    return !!STAND;
  } catch (e){}
  return false;
}

/* De link draagt de lijstaantallen van álle stands. Pas als bekend is welke
   stand dit is, valt er een kolom uit te kiezen. */
function zetStand(nr){
  STAND = nr;
  D.r.forEach(function(r){
    if (r.ins) r.in = (r.ins[nr-1] == null ? null : r.ins[nr-1]);
  });
}

/* ---- bewaren ------------------------------------------------------------ */
/* Bij elke toetsaanslag. Een lege accu of een verkeerde veeg mag geen avond
   tellen kosten. De sleutel hangt aan de show en de stand, zodat twee stands
   op dezelfde telefoon elkaar niet overschrijven. */
function sleutel(){ return 'standcount.' + D.c + '.' + D.d + '.S' + STAND + '.' + D.m; }
function bewaar(){
  try { localStorage.setItem(sleutel(), JSON.stringify({ v:WAARDEN, t:TELLER, op:Date.now() })); }
  catch (e){}
}
function haalTerug(){
  try {
    var x = JSON.parse(localStorage.getItem(sleutel()) || 'null');
    if (x && x.v){ WAARDEN = x.v; if (!TELLER) TELLER = x.t || ''; return x.op || 0; }
  } catch (e){}
  return 0;
}

/* ---- tellen ------------------------------------------------------------- */
function alleRegels(){
  var a = [];
  ITEMS.forEach(function(p){ p.regels.forEach(function(r){ a.push(r); }); });
  return a;
}
function gedaan(){
  return alleRegels().filter(function(r){ return WAARDEN[r.no] !== undefined; }).length;
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---- de coderegel ------------------------------------------------------- */
/* Letterlijk hetzelfde formaat als het oude telvel, zodat "Terug uit WhatsApp"
   in Tumbi er niets van merkt. Niets aan veranderen zonder tlSlParse mee te
   veranderen. */
function code(){
  var paren = [];
  alleRegels().forEach(function(r){
    var v = WAARDEN[r.no];
    if (v !== undefined && v !== '') paren.push(r.no + ':' + v);
  });
  return 'SFM1|' + D.c + '|' + String(D.d).replace(/[^0-9]/g,'') + '|S' + STAND
       + '|' + (D.m === 'in' ? 'IN' : 'FINAL') + '|' + (TELLER || '?') + '|' + paren.join(',');
}
function bericht(){
  var kop = (D.m === 'in' ? 'In count' : 'Final count') + ' — ' + standLabel(STAND);
  /* De artikelen stonden hier vroeger ook allemaal in. Dat is te veel tekst in
     een WhatsApp-bericht en niemand leest het: de cijfers zitten al in de
     coderegel, en die gaat de tool in. Wat blijft staan is wie, waar, en hoeveel
     stuks in totaal — genoeg om in de zaal te zien dat er iets terugkwam. */
  var som = 0;
  alleRegels().forEach(function(r){
    var v = WAARDEN[r.no];
    if (v !== undefined && v !== '') som += parseInt(v, 10) || 0;
  });
  return [
    kop,
    D.b + ' · ' + D.v + ' · ' + D.d,
    'Geteld door: ' + (TELLER || '?'),
    'Totaal: ' + som + ' stuks',
    '',
    code()
  ].join('\n');
}

/* ---- de iconen ---------------------------------------------------------- */
/* Getekend, niet geleend uit de tekenset: een backspace als ⌫ komt op de ene
   telefoon als een pijl en op de andere als een leeg vierkantje. */
var IC = {
  wis:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5H9.4a2 2 0 0 0-1.5.7l-4.6 5.6a1.2 1.2 0 0 0 0 1.4l4.6 5.6a2 2 0 0 0 1.5.7H20a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><path d="M16.5 9.5 12 14m0-4.5 4.5 4.5"/></svg>',
  pijl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13m-5.5-6 6 6-6 6"/></svg>',
  terug:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6m5.5-6-6 6 6 6"/></svg>',
  vink:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5.2 5.2L20 7"/></svg>',
  doos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z"/><path d="M3 7.5 12 12m0 9V12m9-4.5L12 12"/></svg>',
  /* Een stevige chevron in plaats van een dun pijltje: op de grootste toets van
     het scherm viel dat laatste in het niet. */
  ga:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>',
  omlaag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  stuur:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.5 2.5 11 13"/><path d="M21.5 2.5 15 21.5l-4-8.5-8.5-4Z"/></svg>'
};

/* MAAT is waar de telling staat binnen het artikel; VERS onthoudt of het
   volgende cijfer vervangt of aanplakt, LANDT welke regel net een waarde kreeg. */
var MAAT = 0, VERS = null, LANDT = null, ZEKER = false;

/* ---- tekenen ------------------------------------------------------------ */
/* De zaalkleur komt mee in de link. Op een donker scherm is een donkere
   zaalkleur als letterkleur onleesbaar, dus dan blijft de ondertitel grijs; het
   blokje houdt zijn kleur altijd. */
function donkerScherm(){
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches; }
  catch (e){ return false; }
}
function helderheid(hex){
  var m = String(hex || '').replace('#', '');
  if (m.length !== 6) return null;
  var v = [0, 2, 4].map(function(i){
    var c = parseInt(m.substr(i, 2), 16) / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}
function zaalKleur(){
  var h = String(D.k || '');
  return /^#[0-9a-f]{6}$/i.test(h) ? h : '';
}
function zaalTekstKleur(){
  var h = zaalKleur(); if (!h) return '';
  var l = helderheid(h);
  if (l == null) return '';
  /* Te donker op een donker scherm of te licht op een licht scherm: dan liever
     de gewone grijze regel dan iets wat je in een halfdonkere zaal niet leest. */
  if (donkerScherm() ? l < 0.18 : l > 0.62) return '';
  return h;
}

function showkop(){
  var kl = zaalKleur(), tk = zaalTekstKleur();
  var onder = [D.v, D.d].filter(Boolean).join(' · ');
  return '<div class="hd"><div class="hl">'
    + '<span class="sq"' + (kl ? ' style="background:' + esc(kl) + '"' : '') + '></span>'
    + '<div style="min-width:0"><div class="band">' + esc(D.b) + '</div>'
    + (onder ? '<div class="sub"' + (tk ? ' style="color:' + esc(tk) + '"' : '') + '>'
        + esc(onder) + '</div>' : '')
    + '</div></div>';
}

function kop(){
  var totaal = alleRegels().length, af = gedaan();
  var pct = totaal ? Math.round(af / totaal * 100) : 0;
  return '<div class="kop">' + showkop()
    + '<button type="button" class="hr2" data-wissel="1" aria-label="Andere stand">'
    + '<span class="stand">' + esc(standLabel(STAND)) + '</span>'
    + '<span class="kind">' + (D.m === 'in' ? 'In count' : 'Final count') + '</span></button></div>'
    + '<span class="balk"><i style="width:' + pct + '%"></i></span>'
    + '<span class="vorder">' + af + ' / ' + totaal
    + (TELLER ? ' · ' + esc(TELLER) : '') + '</span></div>';
}

function teken(){
  var app = document.getElementById('app');
  if (POORT) app.innerHTML = poort();
  else if (MENU) app.innerHTML = kop() + overzicht();
  else app.innerHTML = (STAP >= ITEMS.length) ? kop() + slot() : kop() + tellen();
  LANDT = null;
  koppel();
}

/* ---- het aanmeldscherm -------------------------------------------------- */
function poort(){
  var l = standLijst();
  var h = '<div class="kop">' + showkop()
    + '<div class="hr2"><span class="stand">'
    + (l ? (l.length + ' stands') : esc(standLabel(STAND)))
    + '</span><span class="kind">' + (D.m === 'in' ? 'In count' : 'Final count')
    + '</span></div></div></div>'
    + '<div class="poort">'
    + '<p class="vraag">Je naam</p>'
    + '<p class="vraagbij">Komt bij de telling te staan, zodat duidelijk is wie wat geteld heeft.</p>'
    + '<input class="veld" id="naam" placeholder="Je naam" autocomplete="name"'
    + ' autocapitalize="words" value="' + esc(TELLER) + '">';

  if (l){
    h += '<p class="vraag" style="margin-top:18px">Je stand</p>'
      + '<p class="vraagbij">Tik je eigen stand aan.</p><div class="chips">';
    l.forEach(function(nm, i){
      var nr = i + 1;
      h += '<button type="button" class="chip' + (STAND === nr ? ' aan' : '')
        + '" data-kies="' + nr + '"><b>' + nr + '</b><i>'
        + esc(standNaam(nr) || ('stand ' + nr)) + '</i></button>';
    });
    h += '</div>';
  }

  return h + '<div class="rek"></div></div>'
    + '<div class="voet"><button type="button" class="knop" id="start"'
    + (klaar() ? '' : ' disabled') + '>Beginnen met tellen' + IC.pijl + '</button></div>';
}

function tellen(){
  var p = ITEMS[STAP];
  if (MAAT >= p.regels.length) MAAT = 0;

  var h = '<div class="midden"><div class="artikel">'
    + '<button type="button" class="terug" data-vorigart="1" aria-label="Vorig artikel"'
    + (STAP === 0 ? ' disabled' : '') + '>' + IC.terug + '</button>'
    + '<button type="button" class="artnaam" data-menu="1" aria-label="Alle artikelen">'
    + '<h1>' + esc(p.naam) + '</h1>' + IC.omlaag + '</button>'
    + '<span class="teller">' + (STAP + 1) + ' / ' + ITEMS.length + '</span>'
    + '<button type="button" class="terug verder" data-volgart="1" aria-label="Volgend artikel"'
    + (STAP >= ITEMS.length - 1 ? ' disabled' : '') + '>' + IC.pijl + '</button></div>';
  if (p.band) h += '<p class="onder">' + esc(p.band) + '</p>';

  p.regels.forEach(function(r, i){
    var v = WAARDEN[r.no];
    var af = v !== undefined && v !== '';
    h += '<button type="button" class="regel' + (i === MAAT ? ' hier' : '')
      + (LANDT === i ? ' landt' : '') + '" data-ga="' + i + '"'
      + ' aria-label="' + esc(p.regels.length > 1 ? r.name : 'Aantal')
      + (af ? ', ' + esc(v) + ' geteld' : ', nog niet geteld') + '">'
      + '<span class="maat">' + esc(p.regels.length > 1 ? r.name : 'Aantal')
      + (D.m === 'in' && r.in ? '<small>volgens de lijst ' + r.in + '</small>' : '')
      + '</span>'
      + '<span class="waarde ' + (af ? 'af' : 'leeg') + '">' + (af ? esc(v) : '–') + '</span>'
      + '<span class="vink' + (af ? ' aan' : '') + '">' + IC.vink + '</span></button>';
  });

  h += '<button type="button" class="uitverkocht' + (ZEKER ? ' zeker' : '') + '" data-uit="1">'
    + (ZEKER ? 'Zeker weten? Tik nog eens — alles wordt 0'
             : IC.doos + 'Alles uitverkocht') + '</button></div>';
  return h + klavier();
}

function klavier(){
  var p = ITEMS[STAP];
  var laatsteMaat = (MAAT >= p.regels.length - 1);
  var laatsteArt = (STAP >= ITEMS.length - 1);
  var klaar = (laatsteMaat && laatsteArt);
  var label = klaar ? 'Klaar' : (laatsteMaat ? 'Volgend<br>artikel' : 'Volgende<br>maat');
  var h = '<div class="klavier">';
  var toets = function(n){ return '<button type="button" data-cijfer="' + n + '">' + n + '</button>'; };
  h += toets(1) + toets(2) + toets(3)
    + '<button type="button" data-wis="1" aria-label="Laatste cijfer wissen">' + IC.wis + '</button>'
    + toets(4) + toets(5) + toets(6)
    + '<button type="button" class="hulp" data-geen="1">geen</button>'
    + toets(7) + toets(8) + toets(9)
    + '<button type="button" class="door" data-door="1">' + (klaar ? IC.vink : IC.ga)
    + '<span>' + label + '</span></button>'
    + '<button type="button" class="nul" data-cijfer="0">0</button>'
    + '<button type="button" class="vorige" data-vorige="1" aria-label="Vorige regel"'
    + (STAP === 0 && MAAT === 0 ? ' disabled' : '') + '>' + IC.terug + 'vorige</button>';
  return h + '</div>';
}

/* Alle artikelen onder elkaar, met hoever elk is. Bij vijftien artikelen wil je
   niet vijftien keer op volgende tikken om bij de posters te komen — en aan het
   eind wil je zien welk artikel nog openstaat zonder naar het slot te gaan. */
function overzicht(){
  var h = '<div class="midden"><h1 style="font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0 0 3px">Alle artikelen</h1>'
    + '<p class="menubij">Tik er een aan om er meteen heen te gaan.</p>';
  ITEMS.forEach(function(p, pi){
    var af = p.regels.filter(function(r){
      return WAARDEN[r.no] !== undefined && WAARDEN[r.no] !== '';
    }).length;
    var klaar = (af === p.regels.length);
    h += '<button type="button" class="menurij' + (pi === STAP ? ' hier' : '')
      + '" data-ganaar="' + pi + ':0">'
      + '<span class="mnr">' + (pi + 1) + '</span>'
      + '<span class="mnm">' + esc(p.naam)
      + (p.band ? '<small>' + esc(p.band) + '</small>' : '') + '</span>'
      + '<span class="mvoort' + (klaar ? ' af' : '') + '">' + af + ' / ' + p.regels.length
      + (klaar ? IC.vink : '') + '</span></button>';
  });
  return h + '</div><div class="voet">'
    + '<button type="button" class="knop stil" style="flex:1 1 auto" data-menuweg="1">'
    + IC.terug + 'Terug naar tellen</button></div>';
}

function slot(){
  var open = [];
  ITEMS.forEach(function(p, pi){
    p.regels.forEach(function(r, ri){
      if (WAARDEN[r.no] === undefined || WAARDEN[r.no] === '') open.push({ p:p, r:r, pi:pi, ri:ri });
    });
  });

  var h = '<div class="midden slot"><h1>Nakijken en versturen</h1>'
    + '<p class="ondertekend">Geteld door <b>' + esc(TELLER) + '</b> \u00b7 '
    + esc(standLabel(STAND)) + '</p>';

  if (open.length){
    h += '<div class="mist"><b>' + open.length + ' regel' + (open.length === 1 ? '' : 's')
      + ' nog niet geteld</b><p>Een leeg vakje is dubbelzinnig: is het nul, of '
      + 'overgeslagen? Vul ook de nullen in.</p>';
    open.slice(0, 6).forEach(function(o){
      h += '<button type="button" data-ganaar="' + o.pi + ':' + o.ri + '">' + esc(o.p.naam)
        + (o.p.regels.length > 1 ? ' · ' + esc(o.r.name) : '') + ' &rsaquo;</button>';
    });
    if (open.length > 6) h += '<p style="margin:9px 0 0">en nog ' + (open.length - 6) + '</p>';
    h += '</div>';
  }

  /* Elke regel is een knop, ook een die al een getal heeft. Je ziet aan het
     eind pas dat je bij de hoodies twee maten door elkaar hebt gehaald, en dan
     wil je daar naartoe — niet alleen naar wat nog leeg is. */
  var som = 0;
  ITEMS.forEach(function(p, pi){
    p.regels.forEach(function(r, ri){
      var v = WAARDEN[r.no];
      if (v === undefined || v === '') return;
      som += parseInt(v, 10) || 0;
      /* Alleen uitleggen als het afwijkt. Een scherm vol regels die allemaal
         kloppen hoort stil te zijn; dan springt de ene die niet klopt eruit. */
      var d = (D.m === 'in' && r.in != null) ? (parseInt(v, 10) || 0) - r.in : 0;
      h += '<button type="button" class="somrij" data-ganaar="' + pi + ':' + ri + '">'
        + '<span>' + esc(p.naam) + (p.regels.length > 1 ? ' · ' + esc(r.name) : '')
        + (d ? '<small>volgens de lijst ' + r.in + ' — ' + Math.abs(d)
               + (d > 0 ? ' meer' : ' minder') + ' geteld</small>' : '') + '</span>'
        + '<b>' + esc(v) + '</b></button>';
    });
  });
  h += '<div class="somtotaal"><span>Totaal stuks</span><b>' + som + '</b></div>';

  h += '</div>';

  h += '<div class="voet">'
    + '<button type="button" class="knop stil" data-terug="1">' + IC.terug + 'Terug</button>'
    + '<button type="button" class="knop" id="stuur">' + IC.stuur + 'Versturen</button></div>';
  return h;
}

/* ---- wat de knoppen doen ------------------------------------------------ */
function huidigeRegel(){
  var p = ITEMS[STAP];
  return p && p.regels[MAAT] ? p.regels[MAAT] : null;
}

function cijfer(n){
  var r = huidigeRegel(); if (!r) return;
  var nu = WAARDEN[r.no];
  /* Het eerste cijfer na aankomst vervangt wat er stond, daarna plak je aan —
     zoals een kassa. Er wordt alleen gezet, nooit stilletjes gewist. */
  if (nu === undefined || VERS !== r.no) WAARDEN[r.no] = String(n);
  else WAARDEN[r.no] = (nu + String(n)).replace(/^0+(?=\d)/, '').slice(0, 4);
  VERS = r.no; LANDT = MAAT; ZEKER = false;
  bewaar(); teken();
}
function wis(){
  var r = huidigeRegel(); if (!r) return;
  if (WAARDEN[r.no] === undefined) return;
  var t = String(WAARDEN[r.no]).slice(0, -1);
  if (t === '') delete WAARDEN[r.no]; else WAARDEN[r.no] = t;
  VERS = r.no; ZEKER = false;
  bewaar(); teken();
}
function door(){
  VERS = null; ZEKER = false;
  if (MAAT < ITEMS[STAP].regels.length - 1) MAAT++;
  else { STAP++; MAAT = 0; }
  window.scrollTo(0, 0); teken();
}
function geen(){
  var r = huidigeRegel(); if (!r) return;
  WAARDEN[r.no] = '0'; LANDT = MAAT; bewaar(); door();
}
/* De spiegel van de blauwe toets: precies één regel terug. Vanaf de eerste maat
   van een artikel kom je zo bij de laatste maat van het vorige — wie zich bij de
   M vertikt hoeft niet het hele shirt opnieuw langs. */
function vorige(){
  VERS = null; ZEKER = false;
  if (MAAT > 0) MAAT--;
  else if (STAP > 0){
    STAP--;
    MAAT = Math.max(0, ITEMS[STAP].regels.length - 1);
  } else return;
  window.scrollTo(0, 0); teken();
}
function volgendArtikel(){
  if (STAP >= ITEMS.length - 1) return;
  STAP++; MAAT = 0; VERS = null; ZEKER = false;
  window.scrollTo(0, 0); teken();
}
function vorigArtikel(){
  if (STAP === 0) return;
  STAP--; MAAT = 0; VERS = null; ZEKER = false;
  window.scrollTo(0, 0); teken();
}
function uitverkocht(){
  var p = ITEMS[STAP];
  var ingevuld = p.regels.some(function(r){
    return WAARDEN[r.no] !== undefined && WAARDEN[r.no] !== '' && WAARDEN[r.no] !== '0';
  });
  if (ingevuld && !ZEKER){ ZEKER = true; return teken(); }
  p.regels.forEach(function(r){ WAARDEN[r.no] = '0'; });
  VERS = null; ZEKER = false; STAP++; MAAT = 0;
  bewaar(); window.scrollTo(0, 0); teken();
}
function ganaar(pi, ri){
  STAP = pi; MAAT = ri; VERS = null; ZEKER = false; MENU = false;
  window.scrollTo(0, 0); teken();
}

/* ---- knopen leggen ------------------------------------------------------ */
function koppel(){
  var app = document.getElementById('app');

  app.onclick = function(e){
    var el = e.target.closest('[data-cijfer],[data-wis],[data-geen],[data-door],[data-vorige],[data-ga],[data-uit],[data-ganaar],[data-terug],[data-vorigart],[data-volgart],[data-menu],[data-menuweg],[data-kies],[data-wissel],#start,#stuur');
    if (!el || el.disabled) return;
    if (el.dataset.kies){
      var v = document.getElementById('naam');
      if (v) TELLER = v.value.trim();
      STAND = +el.dataset.kies;
      return teken();
    }
    if (el.id === 'start'){
      var n = document.getElementById('naam');
      if (n) TELLER = n.value.trim();
      if (!klaar()) return;
      return begin();
    }
    /* Terug naar de poort: wie op de verkeerde stand is begonnen hoeft de link
       niet opnieuw te vragen. Wat al geteld is blijft per stand bewaard. */
    if (el.dataset.wissel){ POORT = true; return teken(); }
    if (el.dataset.cijfer !== undefined) return cijfer(el.dataset.cijfer);
    if (el.dataset.wis) return wis();
    if (el.dataset.geen) return geen();
    if (el.dataset.door) return door();
    if (el.dataset.vorige) return vorige();
    if (el.dataset.uit) return uitverkocht();
    if (el.dataset.vorigart) return vorigArtikel();
    if (el.dataset.volgart) return volgendArtikel();
    if (el.dataset.menu){ MENU = true; window.scrollTo(0, 0); return teken(); }
    if (el.dataset.menuweg){ MENU = false; window.scrollTo(0, 0); return teken(); }
    if (el.dataset.terug) return ganaar(ITEMS.length - 1, 0);
    if (el.dataset.ganaar){
      var d = el.dataset.ganaar.split(':');
      return ganaar(+d[0], +d[1]);
    }
    if (el.dataset.ga !== undefined){
      MAAT = +el.dataset.ga; VERS = null; ZEKER = false; return teken();
    }
    if (el.id === 'stuur'){
      var naar = D.w ? String(D.w).replace(/[^0-9]/g, '') : '';
      window.location.href = 'https://wa.me/' + naar + '?text=' + encodeURIComponent(bericht());
    }
  };

  /* Niet opnieuw tekenen bij elke aanslag — dan springt de cursor uit het veld.
     Alleen de knop onderaan gaat van grijs naar blauw. */
  var nv = document.getElementById('naam');
  if (nv) nv.addEventListener('input', function(){
    TELLER = nv.value.trim();
    var st = document.getElementById('start');
    if (st) st.disabled = !klaar();
  });
}

/* Op een laptop hoort een toetsenbord gewoon te werken. Op de telefoon komt er
   geen aan te pas — dit scherm heeft zijn eigen cijfers. */
document.addEventListener('keydown', function(e){
  if (!D || POORT || MENU || !ITEMS.length || STAP >= ITEMS.length) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
  if (/^[0-9]$/.test(e.key)){ e.preventDefault(); return cijfer(e.key); }
  if (e.key === 'Backspace'){ e.preventDefault(); return wis(); }
  if (e.key === 'Enter' || e.key === 'ArrowRight'){ e.preventDefault(); return door(); }
  if (e.key === 'ArrowLeft'){ e.preventDefault(); return vorige(); }
});

/* ---- beginnen ------------------------------------------------------------
   Van de poort naar de telling. Alleen als de stand verandert wordt er opnieuw
   opgehaald: wie per ongeluk op de kop tikt en weer op Beginnen drukt, staat
   terug bij het artikel waar hij was. */
var GESTART = 0, OPGEHAALD = 0;
function begin(){
  POORT = false;
  if (STAND !== GESTART){
    GESTART = STAND;
    zetStand(STAND);
    WAARDEN = {}; STAP = 0; MAAT = 0; VERS = null; ZEKER = false;
    OPGEHAALD = haalTerug();
    /* Een link mag aantallen meebrengen. Dat is handig om een halve telling
       door te sturen, en om een proef te doen zonder alles opnieuw in te
       tikken. Wat op de telefoon zelf bewaard is wint: dat is nieuwer. */
    if (D.t && !OPGEHAALD){
      Object.keys(D.t).forEach(function(k){ WAARDEN[k] = String(D.t[k]); });
      bewaar();
    }
  }
  wieBewaar();
  document.title = D.b + ' \u2014 ' + standLabel(STAND);
  teken();
  if (OPGEHAALD){
    var el = document.createElement('div');
    el.className = 'bewaard';
    el.textContent = 'Je eerdere telling van ' + new Date(OPGEHAALD).toLocaleTimeString('nl-NL',
      { hour:'2-digit', minute:'2-digit' }) + ' is teruggezet.';
    var m = document.querySelector('.midden');
    if (m) m.insertBefore(el, m.firstChild);
    OPGEHAALD = 0;
  }
}

/* ---- starten ------------------------------------------------------------ */
(function(){
  D = uitHash();

  /* Twee heel verschillende dingen, en ze verdienen niet hetzelfde antwoord.
     Het kale adres openen is geen fout: deze pagina hoort leeg te zijn. Pas als
     er wél iets achter de # staat maar het niet te lezen is, is er een link
     onderweg stukgegaan. */
  if (D === 'leeg'){
    document.getElementById('app').innerHTML =
      '<div class="stuk"><h1>Deze pagina is leeg</h1>'
      + '<p>Dat hoort zo. Hier staat niets over een show — die komt mee in de '
      + 'link die je per WhatsApp krijgt.</p>'
      + '<p style="margin-top:18px">Open de link uit het bericht, niet dit adres.</p></div>';
    return;
  }
  if (!D || !D.r || !D.r.length){
    document.getElementById('app').innerHTML =
      '<div class="stuk"><h1>Deze link is niet compleet</h1>'
      + '<p>Vraag of hij nog een keer gestuurd wordt. Kopieer hem helemaal '
      + '— een link die halverwege is afgeknipt doet het niet.</p></div>';
    return;
  }
  D.r = D.r.map(function(a){
    var r = { no:a[0], name:a[1], kind:a[2], in:null };
    if (a[3] != null && a[3] !== ''){
      if (D.stands) r.ins = String(a[3]).split(',').map(function(x){ return parseInt(x, 10) || 0; });
      else r.in = parseInt(a[3], 10);
    }
    return r;
  });
  ITEMS = groepeer(D.r);
  document.title = D.b + ' — Stand Count';

  /* Een link van de oude soort draagt zijn eigen stand mee; dan staat die vast
     en hoeft alleen de naam nog gevraagd te worden. */
  if (!standLijst()) STAND = parseInt(D.s, 10) || 0;

  /* Wie zich op deze telefoon al gemeld heeft gaat meteen door. */
  if (wieTerug()) begin();
  else teken();
})();
</script>
